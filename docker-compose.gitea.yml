services:
  gitea:
    container_name: gitea
    image: gitea/gitea:latest
    hostname: gitea
    restart: always
    environment:
      # https://docs.gitea.io/en-us/install-with-docker/#environments-variables
      - USER_UID=120
      - USER_GID=128
      - DOMAIN="gitea.domain.com"
      - SSH_DOMAIN="gitea.domain.com"
      - HTTP_PORT=80
      - ROOT_URL=https://gitea.domain.com
      - SSH_PORT=10022
      - SSH_LISTEN_PORT=22
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=XX.XX.XX.XX
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=test_user
      - GITEA__database__PASSWD=XXXXXXXXXXXX
    ports:
      - "127.0.0.1:10080:80"
      - "10022:22"
    networks:
      - cicd_net
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  drone:
    container_name: drone
    image: drone/drone:latest
    hostname: drone
    restart: always
    depends_on:
      - gitea
    environment:
      # https://docs.drone.io/server/provider/gitea/
      - DRONE_DATABASE_DRIVER=sqlite3
      - DRONE_DATABASE_DATASOURCE=/data/database.sqlite
      - DRONE_GITEA_SERVER=https://gitea.domain.com/
      - DRONE_GIT_ALWAYS_AUTH=false
      - DRONE_RPC_SECRET=XXXXXXXXXXXX
      - DRONE_SERVER_PROTO=https
      - DRONE_SERVER_HOST=drone.domain.com
      - DRONE_USER_CREATE=test_user2
      - DRONE_GITEA_CLIENT_ID=XXXXXXXX
      - DRONE_GITEA_CLIENT_SECRET=XXXXXXXX
    ports:
      - "10081:80"
    networks:
      - cicd_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./drone:/data

  drone-runner:
    container_name: drone-runner
    image: drone/drone-runner-docker:latest
    hostname: drone-runner
    restart: always
    depends_on:
      - drone
    environment:
      # https://docs.drone.io/runner/docker/installation/linux/
      # https://docs.drone.io/server/metrics/
      - DRONE_RPC_PROTO=https
      - DRONE_RPC_HOST=drone.domain.com
      - DRONE_RPC_SECRET=XXXXXXXXXXXX
      - DRONE_RUNNER_NAME="drone-runner"
      - DRONE_RUNNER_CAPACITY=1
      - DRONE_RUNNER_NETWORKS=cicd_net
      - DRONE_DEBUG=false
      - DRONE_TRACE=false
    ports:
      - "10082:3000"
    networks:
      - cicd_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  cicd_net:
    name: cicd_net
